name: Graphify Refresh

on:
  push:
    branches:
      - release/phase3-closeout
    paths-ignore:
      - 'graphify-out/**'
      - '.github/workflows/graphify-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphifyy
          graphify install

      - name: Refresh graph
        run: graphify update .

      - name: Commit refreshed graph
        run: |
          if git diff --quiet -- graphify-out; then
            echo "Graphify output already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out
          git commit -m "chore(graphify): refresh code graph"
          git push
