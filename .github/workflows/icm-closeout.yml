name: ICM Closeout

on:
  push:
    branches:
      - feat/icm-fundraising-hermes-9-5

permissions:
  contents: write

jobs:
  normalize-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/icm-fundraising-hermes-9-5
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Normalize ICM and release UI files
        run: |
          pnpm exec prettier --write --ignore-unknown \
            AGENTS.md \
            agents/hermes/SOUL.md \
            "icm/**/*.md" \
            "apps/ui/src/app/[locale]/donate/page.tsx" \
            "apps/ui/src/app/[locale]/gallery/page.tsx" \
            "apps/ui/src/app/[locale]/work-with-us/page.tsx" \
            "apps/ui/src/components/homepage/TimelineSection.tsx" \
            "apps/ui/src/components/homepage/SupportSection.tsx" \
            apps/ui/src/components/site/SiteFooter.tsx

      - name: Install Graphify
        run: python -m pip install --disable-pip-version-check graphifyy

      - name: Refresh Graphify
        run: graphify update .

      - name: Normalize graph report
        run: pnpm exec prettier --write graphify-out/GRAPH_REPORT.md

      - name: Commit closeout artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            agents/hermes/SOUL.md \
            icm \
            apps/ui/src/app/[locale]/donate/page.tsx \
            apps/ui/src/app/[locale]/gallery/page.tsx \
            apps/ui/src/app/[locale]/work-with-us/page.tsx \
            apps/ui/src/components/homepage/TimelineSection.tsx \
            apps/ui/src/components/homepage/SupportSection.tsx \
            apps/ui/src/components/site/SiteFooter.tsx \
            graphify-out/GRAPH_REPORT.md \
            graphify-out/graph.json \
            graphify-out/graph.html \
            graphify-out/manifest.json \
            graphify-out/.graphify_labels.json \
            graphify-out/.graphify_labels.json.sig
          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi
          HUSKY=0 git -c core.hooksPath=/dev/null commit -m "chore(icm): normalize release and refresh graph"
          git push origin HEAD:feat/icm-fundraising-hermes-9-5
