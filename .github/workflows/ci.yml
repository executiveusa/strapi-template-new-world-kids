name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  build_and_verify:
    name: Install, Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify First 12 pathway model
        run: node scripts/verify-nwk-pathways.mjs

      - name: Verify First 12 public truth
        run: node scripts/verify-nwk-public-truth.mjs

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Prepare Environment Variables
        run: |
          cp apps/ui/.env.local.example apps/ui/.env.local

      - name: Run linter
        run: pnpm lint

      - name: Format phase 3 files
        run: |
          pnpm exec prettier --write --ignore-unknown \
            'apps/ui/src/app/[locale]/(homepage)/page.tsx' \
            'apps/ui/src/components/homepage/NonprofitHero.tsx' \
            'apps/ui/src/components/homepage/PathwaySection.tsx' \
            'apps/ui/src/components/homepage/SupportSection.tsx'

      - name: Upload formatted phase 3 source
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-formatted-source
          path: |
            apps/ui/src/app/[locale]/(homepage)/page.tsx
            apps/ui/src/components/homepage/NonprofitHero.tsx
            apps/ui/src/components/homepage/PathwaySection.tsx
            apps/ui/src/components/homepage/SupportSection.tsx
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: pnpm test:ci

      - name: Build UI
        run: |
          rm -rf apps/ui/.next
          pnpm build:ui

      - name: Build Hermes
        run: pnpm build:hermes
