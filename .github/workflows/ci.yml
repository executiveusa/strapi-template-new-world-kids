name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  build_and_verify:
    name: Install, Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify First 12 pathway model
        run: node scripts/verify-nwk-pathways.mjs

      - name: Verify First 12 public truth
        run: node scripts/verify-nwk-public-truth.mjs

      - name: Verify First 12 operating layer
        run: node scripts/verify-nwk-operating-layer.mjs

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Prepare Environment Variables
        run: |
          cp apps/ui/.env.local.example apps/ui/.env.local

      - name: Run linter
        run: pnpm lint

      - name: Format and commit Phase 4 source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '(\.md$|\.css$|\.scss$|\.tsx$|\.ts$|package\.json$)' || true)
          if [ ${#files[@]} -eq 0 ]; then
            exit 0
          fi
          pnpm exec prettier --write --ignore-unknown "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply canonical Phase 4 formatting"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run unit tests
        run: pnpm test:ci

      - name: Build UI
        run: |
          rm -rf apps/ui/.next
          pnpm build:ui

      - name: Build Hermes
        run: pnpm build:hermes
