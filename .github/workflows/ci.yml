name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  build_and_verify:
    name: Install, Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify First 12 pathway model
        run: node scripts/verify-nwk-pathways.mjs

      - name: Verify First 12 public truth
        run: node scripts/verify-nwk-public-truth.mjs

      - name: Verify First 12 operating layer
        run: node scripts/verify-nwk-operating-layer.mjs

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Prepare Environment Variables
        run: |
          cp apps/ui/.env.local.example apps/ui/.env.local

      - name: Run linter
        run: pnpm lint

      - name: Format Phase 4 files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '(\.md$|\.css$|\.scss$|\.tsx$|\.ts$|package\.json$)' || true)
          if [ ${#files[@]} -gt 0 ]; then
            pnpm exec prettier --write --ignore-unknown "${files[@]}"
          fi

      - name: Upload formatted Phase 4 source
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-formatted-source
          path: |
            apps/ui/src/app/[locale]/(homepage)/page.tsx
            apps/ui/src/app/[locale]/opportunity
            apps/ui/src/app/[locale]/mentor
            apps/ui/src/components/homepage/Homepage.tsx
            apps/ui/src/components/homepage/PathwaySection.tsx
            apps/ui/src/components/homepage/First12OperatingBoard.tsx
            apps/ui/src/components/homepage/ProofOfWorkFeed.tsx
            apps/ui/src/lib/nwkids
            apps/ui/README.md
            docs/NWK_FIRST_12_OPERATING_LAYER.md
          retention-days: 1

      - name: Run unit tests
        run: pnpm test:ci

      - name: Build UI
        run: |
          rm -rf apps/ui/.next
          pnpm build:ui

      - name: Build Hermes
        run: pnpm build:hermes
